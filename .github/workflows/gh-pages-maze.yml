name: gh-pages-maze

on:
  push:
    branches: [ "main" ]
    paths: [ "python/**" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "python/**" ]
  workflow_dispatch:

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch   # into $GITHUB_WORKSPACE
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.13'
          pip-install: -r python/requirements.txt

      - name: Build test.html and test.wad
        run: make -C python

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v5.0.0

      - name: Deploy GitHub Pages site
        uses: actions/deploy-pages@v3.0.2-node.24
